<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Pedido Enviado – SurtiPaez</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
  <style>
    body{font-family:'Nunito',sans-serif;background:linear-gradient(135deg,#1a4a1a,#2d6a2d 50%,#5c3a1e);min-height:100vh;display:flex;align-items:center;justify-content:center;}
    .card{background:white;border-radius:28px;padding:60px 48px;text-align:center;max-width:480px;width:90%;box-shadow:0 24px 60px rgba(0,0,0,0.3);}
    .big{font-size:5rem;margin-bottom:20px;}
    h1{font-family:'Playfair Display',serif;color:#2d6a2d;font-size:2rem;margin-bottom:12px;}
    p{color:#666;line-height:1.6;margin-bottom:28px;}
    a{display:inline-block;background:linear-gradient(135deg,#f9c22e,#e8650a);color:#5c3a1e;font-weight:800;padding:14px 36px;border-radius:50px;text-decoration:none;transition:transform 0.2s;}
    a:hover{transform:translateY(-2px);}
  </style>
</head>
<body>
  <div class="card">
    <div class="big">🎉</div>
    <h1>¡Pedido Recibido!</h1>
    <p>Gracias por tu pedido en <strong>SurtiPaez</strong>. Nos pondremos en contacto contigo muy pronto para confirmar tu pedido.</p>
    <a href="index.html">← Volver al inicio</a>
  </div>
</body>
</html>
